  - id: "CVE-2024-53981"
    package: "python-multipart"
    version: "0.0.9"
    severity: "High"
    reason: "Уязвимость DoS в multipart парсере. Требуется обновление до версии 0.0.18. Временный waiver для планирования фикса."
    issue: "https://github.com/your-username/course-project-Allonso0-public/issues/1"
    expires_at: "2025-12-15"
    approved_by: "tutor@example.org"
    action_required: "update"

