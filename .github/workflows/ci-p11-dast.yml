name: Security - DAST (P11, ZAP baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-p11-dast.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast_p11:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install "uvicorn[standard]"

      - name: Create minimal env file for CI
        run: |
          echo "Creating .env file for CI..."
          cat > .env << EOF
          DATABASE_URL=sqlite:///./test_reading_list.db
          SECRET_KEY=ci-test-secret-key-do-not-use-in-production
          DEBUG=False
          UPLOAD_DIR=./uploads
          MAX_UPLOAD_SIZE=10485760
          EOF
          cat .env

      - name: Run app
        run: |
          echo "=== Starting FastAPI app ==="

          lsof -ti:8000 | xargs kill -9 2>/dev/null || true

          uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning &
          APP_PID=$!
          echo "App PID: $APP_PID"

          echo "=== Waiting for app to start (max 30 seconds) ==="
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "✓ App is ready after $i seconds!"
              curl -s http://localhost:8000/api/v1/health | jq . || echo "Health check response:"
              curl -s http://localhost:8000/api/v1/health
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ App failed to start after 30 seconds"
              echo "Checking processes:"
              ps aux | grep uvicorn || true
              echo "Checking port 8000:"
              netstat -tuln | grep :8000 || true
              exit 1
            fi
            echo "  Attempt $i/30: Waiting..."
            sleep 1
          done

          echo "=== Testing endpoints ==="
          curl -s http://localhost:8000/ || echo "Root endpoint failed"
          echo ""

      - name: ZAP Baseline
        run: |
          echo "=== Starting ZAP baseline scan ==="
          echo "Current directory: $(pwd)"

          docker run --rm --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
              -t http://localhost:8000 \
              -r /zap/wrk/zap_baseline.html \
              -J /zap/wrk/zap_baseline.json \
              -d \
              -c /zap/wrk/zap_baseline.conf \
              -I \
              -j \
              --hook=/zap/wrk/.zap_hook.py || echo "ZAP scan completed with exit code $?"

          echo "=== Checking generated files ==="
          ls -la *.html *.json 2>/dev/null || echo "No report files in root"

          if [ -f "zap_baseline.html" ]; then
            echo "Moving HTML report to EVIDENCE/P11/"
            mv zap_baseline.html EVIDENCE/P11/
          else
            echo "HTML report not found"
          fi

          if [ -f "zap_baseline.json" ]; then
            echo "Moving JSON report to EVIDENCE/P11/"
            mv zap_baseline.json EVIDENCE/P11/
          else
            echo "JSON report not found"
          fi

          echo "=== Final EVIDENCE/P11 contents ==="
          ls -la EVIDENCE/P11/

      - name: Upload P11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
          retention-days: 30
