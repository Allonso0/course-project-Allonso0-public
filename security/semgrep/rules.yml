rules:
  - id: fastapi-direct-db-model-return
    languages: [python]
    message: "Direct return of SQLAlchemy models may expose internal fields"
    severity: WARNING
    patterns:
      - pattern: |
          return $MODEL
      - pattern-inside: |
          @router.$METHOD("...")
          async def $FUNC(...):
            ...
            $BODY
      - metavariable-regex:
          metavariable: $MODEL
          regex: "(session|query|db|repository)"
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"

  - id: sqlalchemy-raw-sql-injection
    languages: [python]
    message: "Raw SQL query may be vulnerable to injection"
    severity: ERROR
    patterns:
      - pattern: |
          session.execute(f"SELECT ... $VAR ...")
      - pattern: |
          session.execute("..." + $VAR + "...")
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"

  - id: file-upload-validation-missing
    languages: [python]
    message: "File upload should validate file type and size"
    severity: WARNING
    patterns:
      - pattern: |
          @router.post("...upload...")
          async def $FUNC(..., file: UploadFile = File(...)):
            ...
      - pattern-not: |
          if $FILE_TYPE_CHECK:
            ...
      - pattern-not: |
          if $FILE_SIZE_CHECK:
            ...
    metadata:
      category: security
      cwe: "CWE-434: Unrestricted Upload of File"

  - id: debug-mode-enabled
    languages: [python]
    message: "Debug mode should not be enabled in production"
    severity: ERROR
    pattern: |
      debug=True
    metadata:
      category: security
